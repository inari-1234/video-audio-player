name: iOS CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project VideoAudioPlayer.xcodeproj \
            -target VideoAudioPlayer \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build
