name: PWA Audio Correction F0 CI

on:
  push:
    branches: [candidate/pwa-library-v1, candidate/audio-correction-f0]
    paths:
      - 'pwa/**'
      - '.github/workflows/pwa-ci.yml'
  pull_request:
    paths:
      - 'pwa/**'
      - '.github/workflows/pwa-ci.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pwa/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run check

      - name: IndexedDB library CRUD regression
        run: npm run smoke:library

      - name: Audio correction parser/filter regression
        run: npm run smoke:correction

      - name: Service Worker syntax check
        run: node --check public/sw.js

      - name: Build PWA
        run: npm run build

      - name: Install FFmpeg test dependency
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi

      - name: Verify required audio correction filters
        run: |
          ffmpeg -hide_banner -filters > /tmp/filters.txt
          for filter in dynaudnorm acompressor loudnorm aresample alimiter; do
            grep -Eq "[[:space:]]${filter}[[:space:]]" /tmp/filters.txt
          done
          echo "Required correction filters: PASS"

      - name: Verify correction chain syntax with AAC output
        run: |
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i sine=frequency=700:sample_rate=48000:duration=6 \
            -af "dynaudnorm=f=1000:g=31:p=0.95:m=2.0:t=0.02:n=1,acompressor=threshold=0.125:ratio=1.5:attack=20:release=250:makeup=1,loudnorm=I=-16:LRA=11:TP=-1.5,aresample=48000,alimiter=limit=0.841395:attack=5:release=50:level=0" \
            -c:a aac -b:a 256k -ar 48000 -ac 2 /tmp/correction-chain.m4a
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 /tmp/correction-chain.m4a)" = "aac"
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of csv=p=0 /tmp/correction-chain.m4a)" = "48000"
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of csv=p=0 /tmp/correction-chain.m4a)" = "2"
          echo "Correction filter chain + AAC output: PASS"

      - name: Create H.264 + AAC stereo MOV fixture
        run: |
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i color=c=black:s=320x240:r=30:d=3 \
            -f lavfi -i sine=frequency=1000:sample_rate=48000:duration=3 \
            -c:v libx264 -pix_fmt yuv420p -preset ultrafast \
            -c:a aac -b:a 192k -ac 2 \
            -shortest /tmp/input.mov

      - name: Run forced-copy extraction
        run: npm run smoke:copy -- /tmp/input.mov /tmp/output.m4a

      - name: Verify output structure
        run: |
          test "$(ffprobe -v error -select_streams v -show_entries stream=index -of csv=p=0 /tmp/output.m4a | wc -l)" -eq 0
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 /tmp/output.m4a)" = "aac"
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of csv=p=0 /tmp/output.m4a)" = "48000"
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of csv=p=0 /tmp/output.m4a)" = "2"

      - name: Prove encoded AAC packets are unchanged
        run: |
          ffmpeg -v error -i /tmp/input.mov -map 0:a:0 -c copy -f data - | sha256sum | cut -d' ' -f1 > /tmp/input.sha
          ffmpeg -v error -i /tmp/output.m4a -map 0:a:0 -c copy -f data - | sha256sum | cut -d' ' -f1 > /tmp/output.sha
          echo "input=$(cat /tmp/input.sha)"
          echo "output=$(cat /tmp/output.sha)"
          diff -u /tmp/input.sha /tmp/output.sha
          echo "Encoded packet identity: PASS"

      - name: Upload PWA dist
        uses: actions/upload-artifact@v4
        with:
          name: video-audio-pwa-correction-f0-dist
          path: pwa/dist
          if-no-files-found: error
          retention-days: 14

      - name: Publish validated build to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/candidate/audio-correction-f0'
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/video-audio-pages
          mkdir -p /tmp/video-audio-pages
          cp -R pwa/dist/. /tmp/video-audio-pages/
          touch /tmp/video-audio-pages/.nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf --ignore-unmatch . >/dev/null 2>&1 || true
          git clean -fdx
          cp -R /tmp/video-audio-pages/. .
          git add -A
          git commit -m "Deploy audio correction F0 ${GITHUB_SHA}"
          git push --force origin gh-pages
