<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Video Audio" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Video Audio</title>
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">LOCAL AUDIO LIBRARY</p>
        <h1>動画から音源を保存</h1>
        <p class="lead">端末内で処理し、無変換で抽出できた音源をこのPWA内に保存します。</p>
      </header>

      <section class="card">
        <label class="picker">
          <span>動画を選択</span>
          <input id="video-input" type="file" accept="video/*,.mov,.mp4" />
        </label>
        <p id="file-name" class="muted">未選択</p>
      </section>

      <section id="analysis-card" class="card hidden">
        <div class="section-title">
          <h2>音声情報</h2>
          <span id="analysis-status" class="badge">解析中</span>
        </div>
        <dl class="meta-grid">
          <div><dt>Codec</dt><dd id="codec">—</dd></div>
          <div><dt>Sample Rate</dt><dd id="sample-rate">—</dd></div>
          <div><dt>Channels</dt><dd id="channels">—</dd></div>
          <div><dt>Bitrate</dt><dd id="bitrate">—</dd></div>
          <div><dt>Duration</dt><dd id="duration">—</dd></div>
        </dl>
        <button id="extract-button" type="button" disabled>無変換で抽出して保存</button>
        <progress id="progress" max="1" value="0" class="hidden"></progress>
        <p id="message" class="muted"></p>
      </section>

      <section id="player-card" class="card hidden">
        <div class="section-title">
          <h2 id="player-title">再生中</h2>
          <span class="badge success">再圧縮なし</span>
        </div>
        <audio id="player" controls preload="metadata"></audio>
        <a id="download-link" class="download" download>M4Aをファイルへ保存</a>
      </section>

      <section class="card">
        <div class="section-title">
          <h2>音源ライブラリ</h2>
          <span id="library-count" class="badge">0件</span>
        </div>
        <p id="storage-status" class="muted compact-text">保存領域を確認中…</p>
        <div id="library-empty" class="empty-state">保存した音源はまだありません。</div>
        <div id="library-list" class="library-list"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
